name: OpenWrt LuCI package
on:
  push:
    branches: ['**']
    paths:
      - 'packaging/luci/**'
      - 'tests/luci/**'
      - '.github/workflows/luci.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      core_artifact:
        description: Test the exact core IPK intended for the release
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENWRT_VERSION: 24.10.5
    steps:
      - uses: actions/checkout@v4
      - name: Configuration module tests
        run: node tests/luci/config.test.cjs
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang llvm flex bison gawk gettext libncurses-dev libssl-dev python3-setuptools python3-venv qemu-system-x86 rsync swig unzip zstd file wget
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pexpect playwright==1.55.0
          "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            ${{ runner.temp }}/sdk
            ${{ runner.temp }}/rootfs.tar.gz
          key: openwrt-24.10.5-x86_64-luci-sdk-deps-v1
          restore-keys: openwrt-24.10.5-x86_64-sdk-deps-v1
      - name: Download verified SDK
        run: |
          [ ! -d "$RUNNER_TEMP/sdk" ] || exit 0
          base="https://downloads.openwrt.org/releases/$OPENWRT_VERSION/targets/x86/64"
          curl -fL --retry 3 "$base/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" -o "$RUNNER_TEMP/sdk.tar.zst"
          echo "d3e8ea62fc1c12f93a9c808c2ef4c01b6e149ee240bcd5a74d15bebcbc385bdd  $RUNNER_TEMP/sdk.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sdk"
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/sdk"
          curl -fL --retry 3 "$base/openwrt-$OPENWRT_VERSION-x86-64-rootfs.tar.gz" -o "$RUNNER_TEMP/rootfs.tar.gz"
          echo "fb3245bce37575f1fc9cc467909c37c5b12e49bf7993a34cd19893511bccf40e  $RUNNER_TEMP/rootfs.tar.gz" | sha256sum -c -
      - name: Build packages
        working-directory: ${{ runner.temp }}/sdk
        run: |
          if [ ! -d feeds/base ]; then ./scripts/feeds update -a; fi
          ./scripts/feeds install libbpf elfutils zlib iproute2 luci-base rpcd libubox jsonfilter
          if [ -f package/fakeflow/Makefile ]; then make package/fakeflow/clean; fi
          if [ -f package/luci-app-fakeflow/Makefile ]; then make package/luci-app-fakeflow/clean; fi
          find bin/packages -name 'luci-app-fakeflow_*.ipk' -delete
          rm -rf package/fakeflow/src package/luci-app-fakeflow
          mkdir -p package/fakeflow/src
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C package/fakeflow/src
          # SDK scans nested Makefiles too; these are packaging recipes, not sources.
          rm -f package/fakeflow/src/packaging/openwrt/Makefile package/fakeflow/src/packaging/luci/Makefile
          cp "$GITHUB_WORKSPACE/packaging/openwrt/Makefile" package/fakeflow/Makefile
          mkdir -p package/luci-app-fakeflow
          cp -a "$GITHUB_WORKSPACE/packaging/luci/." package/luci-app-fakeflow/
          cat > .config <<'EOF'
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_PACKAGE_fakeflow=m
          CONFIG_PACKAGE_luci-app-fakeflow=m
          CONFIG_SIGNED_PACKAGES=n
          EOF
          make defconfig
          set -o pipefail
          make -j2 package/luci-app-fakeflow/compile V=s BPF_CLANG=clang 2>&1 | tee "$RUNNER_TEMP/luci-build.log"
      - uses: actions/cache/save@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/sdk
            ${{ runner.temp }}/rootfs.tar.gz
          key: openwrt-24.10.5-x86_64-luci-sdk-deps-v1
      - name: Collect packages
        run: |
          mkdir -p dist build/luci-packages
          find "$RUNNER_TEMP/sdk/bin/packages" -name 'luci-app-fakeflow_*.ipk' -exec cp '{}' dist/ \;
          find "$RUNNER_TEMP/sdk/bin/packages" -name 'fakeflow_*.ipk' -exec cp '{}' build/luci-packages/ \;
          test "$(find dist -name '*.ipk' | wc -l)" -eq 1
          test "$(find dist -name 'luci-app-fakeflow_*_all.ipk' | wc -l)" -eq 1
          cp dist/*.ipk build/luci-packages/
          cp packaging/luci/INSTALL.md dist/
          printf 'OpenWrt SDK: %s\nArchitecture: all (LuCI only)\nSource: %s\n' "$OPENWRT_VERSION" "$(git rev-parse HEAD)" > dist/BUILD.txt
          (cd dist && sha256sum *.ipk > SHA256SUMS)
      - uses: actions/download-artifact@v4
        if: inputs.core_artifact != ''
        with:
          name: ${{ inputs.core_artifact }}
          path: release-core
      - name: Use the release core package for LuCI integration
        if: inputs.core_artifact != ''
        run: |
          (cd release-core && sha256sum -c SHA256SUMS)
          test "$(find release-core -name 'fakeflow_*.ipk' | wc -l)" -eq 1
          rm -f build/luci-packages/fakeflow_*.ipk
          cp release-core/fakeflow_*.ipk build/luci-packages/
      - name: Cache authenticated runtime dependencies
        run: |
          docker import "$RUNNER_TEMP/rootfs.tar.gz" fakeflow-luci:test
          mkdir -p "$RUNNER_TEMP/luci-cache"
          docker run --rm --privileged -v "$RUNNER_TEMP/luci-cache:/cache" -v "$GITHUB_WORKSPACE/build/luci-packages:/packages:ro" fakeflow-luci:test /bin/sh -ec '
            mkdir -p /var/lock
            opkg update
            opkg --cache /cache install /packages/*.ipk luci-theme-bootstrap uhttpd uhttpd-mod-ubus rpcd-mod-file kmod-sched-bpf kmod-dummy kmod-tun
            sh -n /usr/libexec/rpcd/fakeflow
          '
      - name: Test real LuCI and procd in OpenWrt VM
        run: |
          curl -fL --retry 3 "https://downloads.openwrt.org/releases/$OPENWRT_VERSION/targets/x86/64/openwrt-$OPENWRT_VERSION-x86-64-generic-ext4-combined.img.gz" -o "$RUNNER_TEMP/openwrt.img.gz"
          echo "5b854a7a2909a0b21887ba9be773b0964eb28fef81d6b8399d32a0f270a5d8ff  $RUNNER_TEMP/openwrt.img.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/openwrt.img.gz" > "$RUNNER_TEMP/openwrt.img" || test "$?" -eq 2
          FF_IPK_CACHE="$RUNNER_TEMP/luci-cache" "$RUNNER_TEMP/venv/bin/python" tests/luci/vm.py "$RUNNER_TEMP/openwrt.img" build/luci-packages
      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-fakeflow-openwrt-24.10
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luci-test-results
          path: |
            ${{ runner.temp }}/luci-build.log
            build/luci-vm.log
            build/luci-*.png
            build/luci-*.html
            build/luci-trace.zip
