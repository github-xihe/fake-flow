name: Linux build and network tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev libelf-dev zlib1g-dev pkg-config iproute2 python3-scapy nftables tcpdump ethtool
      - run: make -j2
        id: build
      - run: build/fakeflow validate --config config/fakeflow.toml
      - run: make test
      - name: Kernel and toolchain
        run: uname -a && clang --version
      - name: P0 Ethernet kernel path
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo /usr/bin/python3 tests/netns/p0.py
      - name: Protocol and lifecycle integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo /usr/bin/python3 tests/netns/protocols.py
      - name: L3 TUN integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo /usr/bin/python3 tests/netns/l3.py
      - name: PPPoE and VLAN integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo /usr/bin/python3 tests/netns/protocols.py --pppoe
      - name: Routed SNAT and DNAT socket integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo /usr/bin/python3 tests/netns/nat.py
      - name: Crash recovery and interface lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo /usr/bin/python3 tests/netns/lifecycle.py
      - name: Real PPPoE relay coexistence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic
          git clone https://github.com/lilu0826/pppoe-relay-bpf.git build/relay-source
          git -C build/relay-source checkout 3afc58e53fe2939882dcd746be358d97de97cd8e
          bpftool_bin=$(find -L /usr/lib/linux-tools -type f -name bpftool | head -n1)
          test -n "$bpftool_bin"
          make -C build/relay-source -j2 BPFTOOL="$bpftool_bin"
          cc -O2 -Wall -Wextra -Werror tests/tcx_order.c -o build/tcx-order $(pkg-config --cflags --libs libbpf)
          sudo /usr/bin/python3 tests/netns/relay.py build/relay-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-and-logs-${{ matrix.os }}
          path: build/
