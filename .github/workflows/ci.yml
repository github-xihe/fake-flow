name: Linux build and network tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev pkg-config iproute2 python3-scapy
      - run: make -j2
      - run: build/fakeflow validate --config config/fakeflow.toml
      - name: Kernel and toolchain
        run: uname -a && clang --version
      - name: P0 Ethernet kernel path
        run: sudo /usr/bin/python3 tests/netns/p0.py
      - name: Protocol and lifecycle integration
        run: sudo /usr/bin/python3 tests/netns/protocols.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-and-logs
          path: build/
