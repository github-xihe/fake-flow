version = 1

[[interfaces]]
name = "eth1"
mode = "ethernet"

[tcp]
enabled = true
directions = ["active", "passive"]
payload = "http"
hostname = "www.example.com"
# 端口匹配的第二份 TCP 模板：命中 https_ports（默认 443）的连接改发 TLS ClientHello，
# 其余端口仍用上面的模板。两项都留注释则不存在第二份模板。
# https_hostname = "www.speedtest.cn"
# https_payload_file = "/etc/fakeflow/tls.bin"
# https_ports = [443]
tfo = "strip-syn"
max_batches = 3

[udp]
enabled = true
trigger = "egress"
payload = "sip"
sip_uri = "sip:service@example.com"
initial_packets = 5
idle_timeout_seconds = 30

[injection]
ttl = 3
repeat = 2
estimate_hops = true
dynamic_percent = 0
max_packets_per_second = 1000
burst = 2000
allow_private = false

[runtime]
tcp_entries = 8192
udp_entries = 8192
lease_seconds = 10
