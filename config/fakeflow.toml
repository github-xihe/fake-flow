version = 1

[[interfaces]]
name = "eth1"
mode = "ethernet"

[tcp]
enabled = true
directions = ["active", "passive"]
tfo = "strip-syn"
max_batches = 3

# TCP 载荷规则：每条连接在建立时固定使用其中一条，连接之间按这里的顺序轮换。
# type 三选一：http（发 HTTP GET，域名进 Host 头）、tls（发 TLS ClientHello，域名进 SNI）、
# custom（发文件原始字节，payload 写绝对路径）。最多 3 条，至少一条 enabled = true。
[[tcp.rule]]
type = "http"
payload = "speed.gx.chinamobile.com"

# [[tcp.rule]]
# type = "tls"
# payload = "www.speedtest.cn"

# [[tcp.rule]]
# type = "custom"
# payload = "/etc/fakehttp/payload.tls"

[udp]
enabled = true
trigger = "egress"
payload = "sip"
sip_uri = "sip:service@example.com"
initial_packets = 5
idle_timeout_seconds = 30

[injection]
ttl = 3
repeat = 2
estimate_hops = true
dynamic_percent = 0
max_packets_per_second = 1000
burst = 2000
allow_private = false

[runtime]
tcp_entries = 8192
udp_entries = 8192
lease_seconds = 10
