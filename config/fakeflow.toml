version = 1

[[interfaces]]
name = "eth1"
mode = "ethernet"

[tcp]
enabled = true
directions = ["active", "passive"]
payload = "http"
hostname = "www.example.com"
# 端口匹配的第二份 TCP 模板：命中 https_ports（默认 443）的连接改发 TLS ClientHello，
# 其余端口仍用上面的模板。两项都留注释则不存在第二份模板。
# https_hostname = "www.speedtest.cn"
# https_payload_file = "/etc/fakeflow/tls.bin"
# https_ports = [443]
tfo = "strip-syn"
max_batches = 3

# 端口匹配的额外 TCP 模板（数组表），每个 [[tcp.extra]] 一份，按出现顺序占用槽位。
# ports 必填（它是选择该模板的唯一依据，且不能与其他模板重复）；hostname 与
# payload_file 只能填其一；payload 只影响由 hostname 生成的载荷（默认 tls）。
# 与 https_* 合计最多 3 份。下面两段是示例，默认注释掉。
# [[tcp.extra]]
# hostname = "cdn.example.net"
# ports = [8080]
#
# [[tcp.extra]]
# hostname = "plain.example.net"
# payload = "http"
# ports = [8000, 8001]

[udp]
enabled = true
trigger = "egress"
payload = "sip"
sip_uri = "sip:service@example.com"
initial_packets = 5
idle_timeout_seconds = 30

[injection]
ttl = 3
repeat = 2
estimate_hops = true
dynamic_percent = 0
max_packets_per_second = 1000
burst = 2000
allow_private = false

[runtime]
tcp_entries = 8192
udp_entries = 8192
lease_seconds = 10
